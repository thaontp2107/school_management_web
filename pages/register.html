<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-register.css">
</head>
<body>
    <div class="parent">
        <div class="child child1">
            <img src="../images/ic_welcome.png" alt="DAY LA LOGO">
            <p class="welcome"> WELCOME </p>
        </div>
        <div class="child child2">
           <div class="register">
                <select class="select" id="role">
                    <option value="" disabled selected hidden>Select</option>
                    <option value="student">Student</option>
                    <option value="academic">Academic</option>
                    <option value="non">Non academic</option>
                    <option value="parent">Parent</option>
                    <option value="admin">Admin</option>
                </select>

                <input type="text" id="username" class="nhap"
                    placeholder="Enter your name">

                <input type="password" id="password" class="nhap"
                    placeholder="Enter your password">

                <input type="password" id="confirmPassword" class="nhap"
                    placeholder="Confirm your password">

                <br>

                <button class="button" id="btnRegister">
                    REGISTER
                </button>

                <p id="message"></p>

                <a href="login.html">Already have an account? Login</a>
            </div>  
        </div>
    </div>
    
    <script src="../js/register.js"></script>

</body>
</html>

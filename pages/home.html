<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chu</title>
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="tren">
                <img src="../images/ic_welcome.png" alt="welcome logo">
                <button id="hamburger" onclick="toggleMenu()">☰</button>
            </div>
            <div class="duoi">
                <ul id="menu">
                    <li onclick="changePage('Dashboard', this)">
                        <img src="../images/dashboard.png">Dashboard</li>
                    <li onclick="changePage('Students', this)">
                        <img src="../images/student.png">Students</li>
                    <li onclick="changePage('Staff', this)">
                        <img src="../images/academic staff.png">Academic Staff</li>
                    <li onclick="changePage('Non-Academic', this)">
                        <img src="../images/non-academic.png">Non-Academic</li>
                    <li onclick="changePage('Parent', this)">
                        <img src="../images/parent.png">Parent</li>
                    <li onclick="changePage('Admin', this)">
                        <img src="../images/admin.png">Admin</li>
                </ul>
            </div>
        </div> 
        <div class="content">
            <div class="tren-p">
                <h1 id="title"></h1>
            </div>
            <div class="content-box">
                <div id="contentBox"></div>
            </div>
        </div>
    </div>

    

<script src="../js/home.js"></script>
</body>
</html>
